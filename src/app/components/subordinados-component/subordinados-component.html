<h1>Tus sobordinados</h1>
<table class="table table-hover table-striped">
    <thead>
        <th>ID</th>
        <th>Apellido</th>
        <th>Oficio</th>
        <th>Salario</th>
        <th>Director</th>
    </thead>
    <tbody>
        @for(sub of subordinados;track $index){
            <tr>
                <td>{{sub.idEmpleado}}</td>
                <td>{{sub.apellido}}</td>
                <td>{{sub.oficio}}</td>
                <td>{{sub.salario}}</td>
                <td>{{sub.director}}</td>
            </tr>
        }
    </tbody>
</table>
